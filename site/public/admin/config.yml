backend:
  name: github
  repo: RAISEUW/Raise-website
  branch: main
  base_url: https://api.decapcms.org
  # site_domain intentionally omitted — Decap Cloud infers from referrer for public repos.
  # Plan 03 will register the Cloudflare Pages domain in the Decap Cloud dashboard (one-time).

media_folder: "site/public/images/uploads"
public_folder: "/images/uploads"

# Hint UI copy for editors
site_url: https://raise.uw.edu
display_url: https://raise.uw.edu
logo_url: /favicon.svg

collections:
  - name: "articles"
    label: "Articles"
    label_singular: "Article"
    folder: "site/src/content/articles"
    create: true
    slug: "{{slug}}"
    extension: "mdx"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - { label: "Date", name: "date", widget: "datetime", required: true, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { label: "Author", name: "author", widget: "string", required: false, default: "RAISE Team" }
      - { label: "Tags", name: "tags", widget: "list", required: false, default: [], hint: "Lowercase, hyphenated (e.g. ai-policy, nlp)" }
      - { label: "Cover image", name: "cover", widget: "image", required: false, media_library: { config: { multiple: false } }, hint: "Optional hero image; uploads to /images/uploads" }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false, hint: "1-2 sentence summary shown on the Articles index" }
      - { label: "Draft", name: "draft", widget: "boolean", required: false, default: false, hint: "If true, excluded from production build" }
      - { label: "Body", name: "body", widget: "markdown", required: true }

  - name: "events"
    label: "Events"
    label_singular: "Event"
    folder: "site/src/content/events"
    create: true
    slug: "{{slug}}"
    extension: "mdx"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - { label: "Speaker", name: "speaker", widget: "string", required: true }
      - { label: "Speaker bio", name: "speakerBio", widget: "text", required: false }
      - { label: "Speaker photo", name: "speakerPhoto", widget: "image", required: false, media_library: { config: { multiple: false } } }
      - { label: "Date", name: "date", widget: "datetime", required: true, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { label: "Time", name: "time", widget: "string", required: false, hint: "Free-text, e.g. '12:00-13:00 PT'" }
      - { label: "Location", name: "location", widget: "string", required: false, default: "Online" }
      - { label: "Abstract", name: "abstract", widget: "text", required: false }
      - { label: "Recording URL", name: "recording", widget: "string", required: false, hint: "YouTube/Vimeo full URL" }
      - { label: "Slides URL", name: "slides", widget: "string", required: false }
      - { label: "Upcoming", name: "upcoming", widget: "boolean", required: false, default: false, hint: "If true, appears in upcoming events section" }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  - name: "people"
    label: "People"
    label_singular: "Person"
    folder: "site/src/content/people"
    create: true
    slug: "{{slug}}"
    extension: "mdx"
    format: "frontmatter"
    fields:
      - { label: "Name", name: "name", widget: "string", required: true }
      - { label: "Role", name: "role", widget: "select", required: true, options: ["leadership", "affiliate", "staff", "alumni"], hint: "Determines which group this person appears in on /people" }
      - { label: "Title", name: "title", widget: "string", required: true, hint: "E.g. 'Associate Professor', 'PhD Student'" }
      - { label: "Department", name: "department", widget: "string", required: false }
      - { label: "Email", name: "email", widget: "string", required: false, pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', "Must be a valid email address"] }
      - { label: "X / Twitter handle", name: "x", widget: "string", required: false, hint: "Without the @ (e.g. 'raise_uw')" }
      - { label: "LinkedIn URL", name: "linkedin", widget: "string", required: false }
      - { label: "Website", name: "website", widget: "string", required: false }
      - { label: "Photo", name: "photo", widget: "image", required: false, media_library: { config: { multiple: false } }, hint: "Square headshot, 400px min" }
      - { label: "Research areas", name: "researchAreas", widget: "list", required: false, default: [] }
      - { label: "Order", name: "order", widget: "number", required: false, default: 99, value_type: "int", min: 0, hint: "Lower = earlier on the page. Leadership usually 1-10" }
      - label: "Linked publications"
        name: "linkedPublications"
        widget: "relation"
        required: false
        collection: "publications"
        value_field: "{{slug}}"
        search_fields: ["title", "authors"]
        display_fields: ["title"]
        multiple: true
        default: []
      - label: "Linked talks"
        name: "linkedTalks"
        widget: "relation"
        required: false
        collection: "events"
        value_field: "{{slug}}"
        search_fields: ["title", "speaker"]
        display_fields: ["title"]
        multiple: true
        default: []
      - { label: "Body (optional long bio)", name: "body", widget: "markdown", required: false }

  - name: "publications"
    label: "Publications"
    label_singular: "Publication"
    folder: "site/src/content/publications"
    create: true
    slug: "{{slug}}"
    extension: "mdx"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - { label: "Authors", name: "authors", widget: "list", required: true, hint: "One name per item, in citation order" }
      - { label: "Venue", name: "venue", widget: "string", required: true, hint: "Conference / journal name (e.g. 'NeurIPS 2024', 'FAccT 2024')" }
      - { label: "Date", name: "date", widget: "datetime", required: true, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { label: "Topics", name: "topics", widget: "list", required: false, default: [], hint: "Lowercase, hyphenated (e.g. fairness, llm-safety)" }
      - { label: "PDF URL", name: "pdf", widget: "string", required: false, hint: "Prefer local /pdfs/{slug}.pdf over arXiv — run the asset downloader to localize" }
      - { label: "DOI URL", name: "doi", widget: "string", required: false, hint: "Format: https://doi.org/10.xxxx/yyyy" }
      - { label: "Abstract", name: "abstract", widget: "text", required: false }
      - { label: "Body (optional extended notes)", name: "body", widget: "markdown", required: false }
